#
# ByteTrack tracker config for this project, tuned from Ultralytics'
# bundled defaults for classroom CCTV footage: mostly-seated, sometimes
# tightly spaced/partially-occluded people, viewed from a fixed angled
# camera, processed at a few FPS on CPU. This is still ByteTrack
# (tracker_type: bytetrack, unchanged) - only the thresholds below differ
# from Ultralytics' shipped bytetrack.yaml. See config.TRACKER_CONFIG for
# how this file is wired in.
#
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: bytetrack

# First-stage (high-confidence) match threshold. Set to 0.3, tracking this
# project's DETECTION_CONFIDENCE_THRESHOLD (0.20) plus margin. It was 0.5
# while that floor was 0.35; leaving it there after the floor dropped to
# 0.20 would have excluded every newly-recovered small/occluded person from
# first-stage association, so they would keep being re-matched only via the
# weaker second stage (or not at all). Still comfortably above
# track_low_thresh (0.1), so genuinely noisy boxes stay in the second stage.
track_high_thresh: 0.3

# Second-stage (low-score) match threshold, for recovering a track using a
# weaker detection when no high-confidence box matched it this frame.
# Left at Ultralytics' default (0.1) - this is exactly the safety net that
# lets a briefly-occluded or low-confidence person (e.g. partially hidden
# behind a classmate/desk) keep their existing ID instead of being dropped.
track_low_thresh: 0.1

# Minimum confidence to start a brand-new track. Set to 0.20 to match
# DETECTION_CONFIDENCE_THRESHOLD exactly. This matters more than it looks:
# the displayed person count counts *tracks*, not raw detections, so any
# detection scoring below this value is invisible in the UI no matter how
# low the detection threshold is set. Leaving this above the detection
# floor silently discards exactly the small/occluded students that lowering
# the floor was meant to recover.
new_track_thresh: 0.20

# Number of frames a lost track is kept alive, awaiting a re-match, before
# being dropped entirely. Raised 30 -> 60 -> 300, the last step measured on
# the supplied classroom video over 700 frames (tested together with the
# match_thresh change below, so the two are not attributed individually):
#     buffer  60 / match 0.75 -> avg count 20.4, 102 distinct IDs
#     buffer 150 / match 0.75 -> avg count 20.4,  99 distinct IDs
#     buffer 300 / match 0.80 -> avg count 20.6,  72 distinct IDs
# In this footage students stay in their seats for the whole clip, so a
# track that disappears is nearly always the same person flickering out of
# detection rather than someone genuinely leaving. Keeping lost tracks alive
# much longer lets them be re-matched to their original ID instead of being
# issued a fresh one, which cut distinct IDs by 29% without costing count.
track_buffer: 300

# Association similarity (IoU-based cost) threshold used when matching
# detections to existing tracks. Set to 0.80 alongside the track_buffer
# increase above (see that block for the measured comparison). Seated
# students barely move between frames, so a genuine re-match has high IoU;
# requiring a stronger match here stops a long-lived lost track from being
# stolen by a neighbouring student's box, which is the failure mode a large
# track_buffer would otherwise introduce in a densely packed room.
match_thresh: 0.8

# Fuse detection confidence into the matching cost alongside motion/IoU.
# Left at Ultralytics' default (True) - this is what lets a low-confidence
# but well-positioned detection (e.g. a partially occluded seated person)
# still match its existing track instead of being dropped.
fuse_score: True
